<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Basic DOM Manipulation</title>
  
  <style>
    body {
      font-family: Arial, sans-serif;
      padding: 10rem;
      background-color: #e80114;
    }

    .container {
      max-width: 800px;
      padding: 100px;
      background: #f18686;
      border-radius: 100px;
      box-shadow: 0 100px 100px rgba(0, 0, 0, 0.1);
    }

    button {
      padding: 0.5rem 1rem;
      padding: 10px;
      margin-right: 100px;
      cursor: pointer;
      border: 4px solid #000000;
      border-radius: 40px;
      background-color: #fff7af;
      color: rgb(235, 0, 0);
    }

    button:hover {
      background-color: #061dcf;
    }

    .highlight {
      color: #28a745;
      font-weight: bold;
    }
  </style>
</head>
<body>

  <div class="container">
    <h2 id="heading">Original Title</h2>
    <p id="description">Click a button to change this text and its style.</p>
    
    <button id="changeTextBtn">Change Text</button>
    <button id="toggleStyleBtn">Toggle Style</button>
  </div>

  <script>
    // 1. Select DOM elements
    const heading = document.getElementById("heading");
    const description = document.getElementById("description");
    const changeTextBtn = document.getElementById("changeTextBtn");
    const toggleStyleBtn = document.getElementById("toggleStyleBtn");

    // 2. Modify text content on click
    changeTextBtn.addEventListener("click", () => {
      heading.textContent = "Title Updated!";
      description.textContent = "You successfully manipulated the DOM using JavaScript.";
    });

    // 3. Toggle a CSS class on click
    toggleStyleBtn.addEventListener("click", () => {
      description.classList.toggle("highlight");
    });
  </script>

</body>
</html>
